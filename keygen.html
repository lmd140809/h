<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔑 Key Generator</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
  body{
    min-height:100vh;
    background:#0a0c11;color:#e8ebf0;
    padding:16px;font-size:14px;
  }
  .wrap{max-width:520px;margin:0 auto}
  .card{
    background:#12151c;border:1px solid #232833;border-radius:14px;
    padding:20px;margin-bottom:14px;
  }
  h1{font-size:18px;margin-bottom:4px;color:#d4a24c}
  .sub{font-size:11px;color:#5a6273;margin-bottom:18px}
  label{display:block;font-size:10px;font-weight:700;color:#9aa3b3;margin-bottom:5px;letter-spacing:.3px;text-transform:uppercase}
  input,select{
    width:100%;padding:11px 13px;
    background:#0a0d12;border:1px solid #232833;border-radius:8px;
    color:#e8ebf0;font-size:13px;
    font-family:'Courier New',monospace;
    outline:none;margin-bottom:12px;
  }
  input:focus,select:focus{border-color:#d4a24c}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .btn{
    width:100%;padding:13px;border:none;border-radius:8px;
    background:linear-gradient(135deg,#d4a24c,#e63946);color:#fff;
    font-size:14px;font-weight:700;cursor:pointer;
    margin-top:6px;font-family:inherit;
  }
  .btn:active{transform:scale(.98)}
  .btn:disabled{opacity:.5}
  .btn.secondary{background:#1c212c;border:1px solid #2e3542;color:#e8ebf0}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .actions .btn{margin-top:0}
  .result{
    background:#0a0d12;border:1px solid #232833;border-radius:8px;
    padding:12px;font-family:'Courier New',monospace;font-size:12px;
    word-break:break-all;white-space:pre-wrap;
    max-height:400px;overflow-y:auto;margin-top:14px;display:none;
  }
  .result.show{display:block}
  .key-item{
    padding:10px;background:#12151c;border-radius:6px;
    margin-bottom:8px;border-left:3px solid #3ecf8e;
  }
  .key-code{color:#3ecf8e;font-weight:700;font-size:13px;letter-spacing:1px;word-break:break-all}
  .key-meta{color:#5a6273;font-size:10px;margin-top:4px;line-height:1.5}
  .badge{
    display:inline-block;padding:2px 7px;border-radius:4px;
    font-size:9px;font-weight:700;margin-right:4px;
  }
  .badge.ok{background:rgba(62,207,142,.15);color:#3ecf8e}
  .badge.err{background:rgba(230,57,70,.15);color:#ff4d5e}
  .badge.info{background:rgba(74,158,255,.15);color:#4a9eff}
  .toast{
    position:fixed;bottom:16px;left:16px;right:16px;
    padding:12px 16px;background:#1a1e28;border:1px solid #2e3542;
    border-radius:9px;color:#e8ebf0;font-size:12px;font-weight:600;
    transition:transform .3s;z-index:9999;
    transform:translateY(100px);text-align:center;
  }
  .toast.show{transform:translateY(0)}
  .toast.ok{border-color:rgba(62,207,142,.4);color:#3ecf8e}
  .toast.err{border-color:rgba(230,57,70,.4);color:#ff4d5e}
  .help{font-size:10px;color:#5a6273;margin-top:-6px;margin-bottom:12px;font-style:italic}
</style>
</head>
<body>
<div class="wrap">

  <div class="card">
    <h1>🔑 Key Generator</h1>
    <div class="sub">Admin tool — Drag Aim Pro X</div>

    <label>GitHub Token</label>
    <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxx" autocomplete="off">
    <div class="help">💡 Token cần scope "repo". Lưu vào máy tự động.</div>

    <button class="btn secondary" id="saveTokenBtn" style="margin-bottom:16px">💾 Lưu Token</button>

    <hr style="border:none;border-top:1px solid #232833;margin:16px 0">

    <label>🎁 Tạo Key Mới</label>
    <div class="row">
      <div>
        <label style="font-size:9px">Số lượng</label>
        <input type="number" id="count" value="1" min="1" max="50">
      </div>
      <div>
        <label style="font-size:9px">Tier</label>
        <select id="tier">
          <option value="VIP">VIP</option>
          <option value="PRO">PRO</option>
          <option value="TRIAL">TRIAL</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div>
        <label style="font-size:9px">Số ngày</label>
        <input type="number" id="days" value="30" min="0">
      </div>
      <div>
        <label style="font-size:9px">Ghi chú</label>
        <input type="text" id="note" placeholder="Tuỳ chọn">
      </div>
    </div>

    <button class="btn" id="genBtn">⚡ Tạo Key</button>

    <hr style="border:none;border-top:1px solid #232833;margin:16px 0">

    <button class="btn secondary" id="listBtn">📋 Xem danh sách key</button>

    <div class="result" id="result"></div>
  </div>

</div>
<div class="toast" id="toast"></div>

<script>
const REPO_USER = 'lmd140809';
const REPO_NAME = 'h';
const REPO_BRANCH = 'main';
const REPO_FILE = 'keys.json';

const result = document.getElementById('result');
const genBtn = document.getElementById('genBtn');
const listBtn = document.getElementById('listBtn');
const toast = document.getElementById('toast');
const tokenInput = document.getElementById('token');

let lastKeysData = null;

function showToast(msg, type) {
  toast.textContent = msg;
  toast.className = 'toast show ' + (type || '');
  setTimeout(() => toast.classList.remove('show'), 2500);
}

function generateKey() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let parts = [];
  for (let i = 0; i < 3; i++) {
    let p = '';
    for (let j = 0; j < 4; j++) p += chars[Math.floor(Math.random() * chars.length)];
    parts.push(p);
  }
  return 'DAPX-' + parts.join('-');
}

// Đọc keys.json
async function fetchKeys(token) {
  const url = `https://api.github.com/repos/${REPO_USER}/${REPO_NAME}/contents/${REPO_FILE}?ref=${REPO_BRANCH}&t=${Date.now()}`;
  const res = await fetch(url, {
    headers: {
      'Authorization': 'token ' + token,
      'Accept': 'application/vnd.github.v3+json'
    },
    cache: 'no-store'
  });
  if (!res.ok) {
    if (res.status === 401) throw new Error('Token sai/hết hạn');
    if (res.status === 403) throw new Error('Token thiếu scope "repo"');
    if (res.status === 404) throw new Error('File keys.json không tồn tại');
    throw new Error('HTTP ' + res.status);
  }
  const data = await res.json();
  // Decode base64 UTF-8
  const bin = atob(data.content.replace(/\n/g, ''));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const content = new TextDecoder('utf-8').decode(bytes);
  const parsed = JSON.parse(content);
  parsed._sha = data.sha;
  return parsed;
}

// Ghi keys.json
async function saveKeys(token, keysData) {
  const sha = keysData._sha;
  delete keysData._sha;
  keysData.updated = new Date().toISOString();

  const jsonStr = JSON.stringify(keysData, null, 2);
  // Encode base64 UTF-8
  const bytes = new TextEncoder().encode(jsonStr);
  let bin = '';
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  const content = btoa(bin);

  const url = `https://api.github.com/repos/${REPO_USER}/${REPO_NAME}/contents/${REPO_FILE}`;
  const res = await fetch(url, {
    method: 'PUT',
    headers: {
      'Authorization': 'token ' + token,
      'Accept': 'application/vnd.github.v3+json',
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      message: 'Update keys — ' + new Date().toLocaleString('vi-VN'),
      content: content,
      sha: sha,
      branch: REPO_BRANCH
    })
  });
  if (!res.ok) {
    if (res.status === 401) throw new Error('Token không hợp lệ');
    if (res.status === 403) throw new Error('Không có quyền ghi');
    if (res.status === 409) throw new Error('File đã thay đổi, thử lại');
    throw new Error('Lỗi lưu: HTTP ' + res.status);
  }
  return res.json();
}

// ============ SAVE TOKEN ============
document.getElementById('saveTokenBtn').addEventListener('click', () => {
  const t = tokenInput.value.trim();
  if (!t) { showToast('Nhập token trước', 'err'); return; }
  localStorage.setItem('dapToken', t);
  showToast('✅ Đã lưu token vào máy', 'ok');
});

// ============ GENERATE ============
genBtn.addEventListener('click', async () => {
  const token = tokenInput.value.trim() || localStorage.getItem('dapToken');
  const count = parseInt(document.getElementById('count').value) || 1;
  const tier = document.getElementById('tier').value;
  const days = parseInt(document.getElementById('days').value) || 0;
  const note = document.getElementById('note').value.trim();

  if (!token) { showToast('Nhập token trước', 'err'); return; }

  genBtn.disabled = true;
  genBtn.textContent = '⏳ Đang tạo...';

  try {
    const data = await fetchKeys(token);
    if (!Array.isArray(data.keys)) data.keys = [];

    const newKeys = [];
    for (let i = 0; i < count; i++) {
      let newKey;
      do { newKey = generateKey(); }
      while (data.keys.some(k => k.key === newKey));

      const k = {
        key: newKey,
        tier: tier,
        note: note || '',
        createdAt: new Date().toISOString(),
        expires: days > 0 ? new Date(Date.now() + days * 86400000).toISOString() : null,
        banned: false,
        hwid: null,
        usage: 0
      };
      data.keys.push(k);
      newKeys.push(k);
    }

    await saveKeys(token, data);
    lastKeysData = data;

    let html = '<div style="margin-bottom:10px"><span class="badge ok">✅ THÀNH CÔNG</span> Đã tạo ' + count + ' key</div>';
    newKeys.forEach(k => {
      html += '<div class="key-item">' +
        '<div class="key-code">' + k.key + '</div>' +
        '<div class="key-meta">Tier: <b style="color:#d4a24c">' + k.tier + '</b> · Hạn: <b>' +
        (k.expires ? new Date(k.expires).toLocaleDateString('vi-VN') : 'Vĩnh viễn') + '</b>' +
        (k.note ? '<br>📝 ' + k.note : '') +
        '</div></div>';
    });
    result.innerHTML = html;
    result.classList.add('show');
    showToast('✅ Đã tạo ' + count + ' key', 'ok');

  } catch (err) {
    result.innerHTML = '<div style="color:#ff4d5e;padding:10px"><span class="badge err">LỖI</span> ' + err.message + '</div>';
    result.classList.add('show');
    showToast('❌ ' + err.message, 'err');
  } finally {
    genBtn.disabled = false;
    genBtn.textContent = '⚡ Tạo Key';
  }
});

// ============ LIST ============
listBtn.addEventListener('click', async () => {
  const token = tokenInput.value.trim() || localStorage.getItem('dapToken');
  if (!token) { showToast('Nhập token trước', 'err'); return; }

  listBtn.disabled = true;
  listBtn.textContent = '⏳ Đang tải...';

  try {
    const data = await fetchKeys(token);
    lastKeysData = data;

    if (!data.keys || !data.keys.length) {
      result.innerHTML = '<div style="text-align:center;padding:20px;color:#5a6273">📭 Chưa có key</div>';
      result.classList.add('show');
      return;
    }

    const active = data.keys.filter(k => !k.banned && (!k.expires || new Date(k.expires) > new Date())).length;
    const banned = data.keys.filter(k => k.banned).length;
    const expired = data.keys.filter(k => k.expires && new Date(k.expires) <= new Date() && !k.banned).length;

    let html = '<div style="margin-bottom:10px">' +
      '<span class="badge info">TỔNG: ' + data.keys.length + '</span>' +
      '<span class="badge ok">HOẠT ĐỘNG: ' + active + '</span>' +
      '<span class="badge err">BANNED: ' + banned + '</span>' +
      '</div>';

    data.keys.slice().reverse().forEach(k => {
      const isExpired = k.expires && new Date(k.expires) <= new Date();
      const status = k.banned ? '🚫 BANNED' : (isExpired ? '⏰ EXPIRED' : '✅ ACTIVE');
      html += '<div class="key-item" style="' + (k.banned || isExpired ? 'opacity:.6' : '') + '">' +
        '<div class="key-code">' + k.key + '</div>' +
        '<div class="key-meta">' + status + ' · ' + (k.tier || 'VIP') + ' · Dùng: ' + (k.usage || 0) + ' lần<br>' +
        'Tạo: ' + (k.createdAt ? new Date(k.createdAt).toLocaleDateString('vi-VN') : 'N/A') +
        (k.expires ? '<br>Hết hạn: ' + new Date(k.expires).toLocaleDateString('vi-VN') : '') +
        (k.note ? '<br>📝 ' + k.note : '') +
        '</div></div>';
    });

    result.innerHTML = html;
    result.classList.add('show');
    showToast('Đã tải ' + data.keys.length + ' key', 'ok');

  } catch (err) {
    result.innerHTML = '<div style="color:#ff4d5e;padding:10px"><span class="badge err">LỖI</span> ' + err.message + '</div>';
    result.classList.add('show');
    showToast('❌ ' + err.message, 'err');
  } finally {
    listBtn.disabled = false;
    listBtn.textContent = '📋 Xem danh sách key';
  }
});

// Auto load token
window.addEventListener('load', () => {
  const t = localStorage.getItem('dapToken');
  if (t) tokenInput.value = t;
});
</script>
</body>
</html>
