name: Build DragAim APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:  # Cho phép bấm nút build thủ công

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Cài JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Cấp quyền chạy gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. Build APK debug
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # 5. Upload APK - KHÔNG nén (archive: false)
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DragAim-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          archive: false          # ⭐ Quan trọng: tải về là .apk luôn
          retention-days: 30
