name: Build Unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build OGIOS (unsigned)
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Verify source tree
        run: |
          echo "=== source/ ==="
          ls -la source/
          echo "=== Patches ==="
          ls -la "source/ThreeOneOSFive/Patches/" || true
          echo "=== build_unsigned.sh (first 60 lines) ==="
          head -60 source/build_unsigned.sh || true

      - name: Build archive (unsigned)
        run: |
          cd source
          chmod +x build_unsigned.sh
          ./build_unsigned.sh

      - name: Locate archive
        id: locate
        run: |
          cd source
          echo "=== Nội dung build/ ==="
          ls -la build/ || true
          ARCHIVE=$(find build -maxdepth 1 -name "*.xcarchive" -type d | head -n 1)
          if [ -z "$ARCHIVE" ]; then
            echo "❌ Không tìm thấy .xcarchive trong build/"
            exit 1
          fi
          echo "archive=$ARCHIVE" >> $GITHUB_OUTPUT
          echo "✅ Archive: $ARCHIVE"

      - name: Package IPA
        run: |
          cd source
          ARCHIVE="${{ steps.locate.outputs.archive }}"
          APP_PATH="$ARCHIVE/Products/Applications/OGIOS.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "❌ Không tìm thấy app tại: $APP_PATH"
            echo "=== Cấu trúc archive ==="
            find "$ARCHIVE/Products" -maxdepth 3 || true
            exit 1
          fi
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          rm -f OGIOS-unsigned.ipa
          zip -r OGIOS-unsigned.ipa Payload
          ls -lh OGIOS-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: OGIOS-unsigned-ipa
          path: source/OGIOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
