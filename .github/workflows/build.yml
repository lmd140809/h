name: Build MizzeRebuild iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build iOS
    runs-on: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check Xcode
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      # BƯỚC QUAN TRỌNG: Tự động tạo project.yml nếu chưa có
      - name: Ensure project.yml exists
        run: |
          if [ ! -f project.yml ]; then
            echo "project.yml not found, creating a default one..."
            cat << 'EOF' > project.yml
          name: MizzeRebuild
          options:
            bundleIdPrefix: com.mizze
            deploymentTarget:
              iOS: "15.0"
          targets:
            MizzeRebuild:
              type: application
              platform: iOS
              sources: 
                - path: .
              settings:
                base:
                  INFOPLIST_FILE: Info.plist
                  PRODUCT_BUNDLE_IDENTIFIER: com.mizze.rebuild
                  GENERATE_INFOPLIST_FILE: YES
                  CODE_SIGNING_ALLOWED: NO
          schemes:
            MizzeRebuild:
              build:
                targets:
                  MizzeRebuild: all
          EOF
            echo "Created default project.yml"
          else
            echo "project.yml already exists, skipping creation."
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS app (unsigned)
        run: |
          xcodebuild \
            -project MizzeRebuild.xcodeproj \
            -scheme MizzeRebuild \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/MizzeRebuild.app"
          
          # Kiểm tra xem file .app đã được tạo thành công chưa
          if [ ! -d "$APP_PATH" ]; then
            echo "Error: App not found at $APP_PATH"
            echo "Listing built products:"
            find build/DerivedData/Build/Products/ -name "*.app" -type d
            exit 1
          fi

          rm -rf output
          mkdir -p output/Payload
          cp -R "$APP_PATH" output/Payload/

          cd output
          zip -qry MizzeRebuild-unsigned.ipa Payload
          echo "IPA created successfully:"
          ls -lh MizzeRebuild-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MizzeRebuild-unsigned-iOS-ipa
          path: output/MizzeRebuild-unsigned.ipa
          retention-days: 14
