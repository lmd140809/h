
name: Build Unsigned IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build OGIOS (unsigned)
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Verify source tree
        run: |
          echo "=== source/ ==="
          ls -la source/

          echo "=== Patches ==="
          ls -la "source/ThreeOneOSFive/Patches/" || true

          echo "=== Build script ==="
          if [ ! -f source/build_unsigned.sh ]; then
            echo "ERROR: Khong tim thay source/build_unsigned.sh"
            exit 1
          fi

          head -60 source/build_unsigned.sh

      - name: Build archive and IPA
        run: |
          set -euo pipefail

          cd source
          chmod +x build_unsigned.sh
          ./build_unsigned.sh

      - name: Verify IPA output
        run: |
          set -euo pipefail

          IPA="source/build/HYper-Regedit-Key-Enabled-unsigned.ipa"

          echo "=== Build directory ==="
          ls -lah source/build/

          if [ ! -f "$IPA" ]; then
            echo "ERROR: Khong tim thay IPA tai $IPA"
            echo "Kiem tra ten file IPA do build_unsigned.sh tao ra."
            exit 1
          fi

          echo "=== IPA file ==="
          ls -lh "$IPA"

          echo "=== Validate ZIP/IPA structure ==="
          unzip -t "$IPA"

          echo "=== Check Payload/OGIOS.app ==="
          unzip -Z1 "$IPA" | grep -E '^Payload/[^/]+\.app/Info\.plist$'

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: OGIOS-unsigned-ipa
          path: source/build/HYper-Regedit-Key-Enabled-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
